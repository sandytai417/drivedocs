<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DriveDocs — 私人單人版 Google Drive 客戶文件管理。">
  <title>DriveDocs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Noto+Serif+TC:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="shell">
    <header class="navpill" role="banner">
      <button type="button" class="navpill__menu" id="sidebar-toggle" aria-label="開啟選單">☰</button>
      <div class="navpill__brand">
        <span class="dot-logo" aria-hidden="true"></span>
        <span class="navpill__name">DriveDocs</span>
      </div>
      <nav class="navpill__links" aria-label="快捷導覽">
        <button type="button" class="navpill__link" data-page="dashboard">總覽</button>
        <button type="button" class="navpill__link" data-page="customers">客戶</button>
        <button type="button" class="navpill__link" data-page="upload">上傳</button>
      </nav>
      <div class="navpill__search">
        <span aria-hidden="true">⌕</span>
        <input type="search" id="global-search" placeholder="搜尋姓名、電話、地址、生日、身分證…" autocomplete="off">
      </div>
      <div class="navpill__actions">
        <span class="privacy-chip">私人單人</span>
        <button type="button" class="btn btn--ghost btn--sm" data-page="settings">設定</button>
        <button type="button" class="btn btn--primary btn--sm" data-page="upload">上傳</button>
      </div>
    </header>

    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

    <div class="app" id="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__label">功能選單</div>
        <nav class="menu" aria-label="主選單">
          <button type="button" class="menu__item is-active" data-page="dashboard">首頁總覽</button>
          <button type="button" class="menu__item" data-page="customers">客戶列表</button>
          <button type="button" class="menu__item" data-page="upload">新增／上傳</button>
          <button type="button" class="menu__item" data-page="lectures">本週講座</button>
          <button type="button" class="menu__item" data-page="activities">本月活動</button>
          <button type="button" class="menu__item" data-page="reports">每月回報</button>
          <button type="button" class="menu__item" data-page="analytics">報表分析</button>
          <button type="button" class="menu__item" data-page="settings">設定</button>
        </nav>
        <div class="sidebar__foot">
          <div class="drive-card">
            <div class="drive-card__label">Google 雲端硬碟</div>
            <div class="drive-card__bar"><span id="storage-fill"></span></div>
            <div class="drive-card__meta" id="storage-meta">8.24GB / 15GB</div>
            <a class="text-link" href="https://drive.google.com" target="_blank" rel="noopener">前往雲端硬碟 ▸</a>
          </div>
        </div>
      </aside>

      <div class="workspace">
        <main class="main" id="content"></main>
      </div>

      <aside class="rail" id="rail" aria-label="側邊摘要"></aside>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="js/zhuyin.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.querySelectorAll('[data-page]').forEach(function (el) {
      if (el.closest('.menu')) return;
      el.addEventListener('click', function () {
        var page = el.getAttribute('data-page');
        var target = document.querySelector('.menu__item[data-page="' + page + '"]');
        if (target) target.click();
      });
    });
  </script>
</body>
</html>
