<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DriveDocs — Organize Client Documents Directly in Google Drive.">
  <title>DriveDocs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <!-- Left Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <div class="sidebar__name">DriveDocs</div>
          <div class="sidebar__tag">客戶文件管理系統</div>
        </div>
      </div>

      <nav class="menu" aria-label="主選單">
        <button type="button" class="menu__item is-active" data-page="dashboard">
          <span class="menu__ico" aria-hidden="true">⌂</span>首頁總覽
        </button>
        <button type="button" class="menu__item" data-page="customers">
          <span class="menu__ico" aria-hidden="true">☰</span>客戶列表
        </button>
        <button type="button" class="menu__item" data-page="upload">
          <span class="menu__ico" aria-hidden="true">↑</span>新增／上傳
        </button>
        <button type="button" class="menu__item" data-page="lectures">
          <span class="menu__ico" aria-hidden="true">🎙</span>本週講座
        </button>
        <button type="button" class="menu__item" data-page="activities">
          <span class="menu__ico" aria-hidden="true">📅</span>本月活動
        </button>
        <button type="button" class="menu__item" data-page="reports">
          <span class="menu__ico" aria-hidden="true">◎</span>每月回報
        </button>
        <button type="button" class="menu__item" data-page="analytics">
          <span class="menu__ico" aria-hidden="true">▣</span>報表分析
        </button>
        <button type="button" class="menu__item" data-page="settings">
          <span class="menu__ico" aria-hidden="true">⚙</span>設定
        </button>
      </nav>

      <div class="sidebar__foot">
        <div class="drive-card">
          <div class="drive-card__label">Google Drive Storage</div>
          <div class="drive-card__title">Google Drive</div>
          <div class="drive-card__bar"><span id="storage-fill"></span></div>
          <div class="drive-card__meta" id="storage-meta">8.24GB / 15GB</div>
          <a class="btn btn--ghost btn--block" href="https://drive.google.com" target="_blank" rel="noopener">前往 Google Drive</a>
        </div>
      </div>
    </aside>

    <!-- Center -->
    <div class="workspace">
      <header class="topbar">
        <button type="button" class="icon-btn topbar__menu" id="sidebar-toggle" aria-label="選單">☰</button>
        <div class="search">
          <span class="search__ico" aria-hidden="true">⌕</span>
          <input type="search" id="global-search" placeholder="搜尋客戶姓名、電話、文件" autocomplete="off">
        </div>
        <div class="topbar__right">
          <button type="button" class="icon-btn" title="通知" aria-label="通知">🔔</button>
          <button type="button" class="icon-btn" title="說明" aria-label="說明">?</button>
          <div class="user">
            <span class="avatar">王</span>
            <span class="user__name">王小明</span>
          </div>
        </div>
      </header>

      <div class="demo-banner">GitHub Pages Demo · 資料存在本機 · 正式版接 Google Drive 見 <code>apps-script/</code></div>
      <main class="main" id="content"></main>
    </div>

    <!-- Right Sidebar -->
    <aside class="rail" id="rail"></aside>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="js/zhuyin.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
