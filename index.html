<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DriveDocs — Organize Client Documents Directly in Google Drive.">
  <title>DriveDocs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app" class="layout">
    <aside class="sider" id="sidebar">
      <div class="sider__brand">
        <span class="sider__mark" aria-hidden="true"></span>
        <div>
          <div class="sider__name">DriveDocs</div>
          <div class="sider__sub">Workplace</div>
        </div>
      </div>
      <nav class="sider__nav" aria-label="主選單">
        <button type="button" class="sider__item is-active" data-page="dashboard"><span class="sider__ico">◈</span>Dashboard</button>
        <button type="button" class="sider__item" data-page="customers"><span class="sider__ico">☰</span>客戶資料夾</button>
        <button type="button" class="sider__item" data-page="upload"><span class="sider__ico">↑</span>文件上傳</button>
        <button type="button" class="sider__item" data-page="reports"><span class="sider__ico">▣</span>報表</button>
        <button type="button" class="sider__item" data-page="settings"><span class="sider__ico">⚙</span>設定</button>
      </nav>
      <div class="sider__storage">
        <div class="sider__storage-label">Demo 儲存空間</div>
        <div class="sider__storage-bar"><span id="storage-fill" style="width:16%"></span></div>
        <div class="sider__storage-meta" id="storage-meta">本機 Demo · localStorage</div>
      </div>
    </aside>

    <div class="stage">
      <header class="header">
        <button type="button" class="header__menu" id="sidebar-toggle" aria-label="選單">☰</button>
        <div class="header__search">
          <input type="search" id="global-search" placeholder="搜尋客戶、電話、文件…" autocomplete="off">
        </div>
        <div class="header__right">
          <span class="header__chip">GitHub Pages Demo</span>
          <div class="header__user">
            <span class="header__avatar">S</span>
            <span class="header__uname">示範使用者</span>
          </div>
        </div>
      </header>

      <div class="notice">
        靜態 Demo：介面仿雲端硬碟／管理後台。正式版接 Google Drive 見 <code>apps-script/</code>。
      </div>

      <main class="main" id="content"></main>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="js/zhuyin.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
