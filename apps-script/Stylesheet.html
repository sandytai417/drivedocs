<style>
  :root {
    --ink: #13201e;
    --ink-soft: #3a4a47;
    --muted: #6b7a76;
    --paper: #eef3f1;
    --paper-2: #e2ebe7;
    --surface: #f7faf8;
    --line: rgba(19, 32, 30, 0.12);
    --line-strong: rgba(19, 32, 30, 0.22);
    --brand: #0b4f48;
    --brand-deep: #073833;
    --accent: #c45c26;
    --accent-soft: #f3e0d4;
    --ok: #1f7a4d;
    --warn: #b45309;
    --danger: #b42318;
    --shadow: 0 18px 50px rgba(11, 79, 72, 0.12);
    --radius: 14px;
    --font-serif: "Instrument Serif", "Noto Serif TC", serif;
    --font-sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --sidebar-w: 248px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    font-family: var(--font-sans);
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(11, 79, 72, 0.14), transparent 55%),
      radial-gradient(900px 500px at 100% 0%, rgba(196, 92, 38, 0.10), transparent 50%),
      linear-gradient(165deg, #dfe9e5 0%, var(--paper) 42%, #e8efe9 100%);
    background-attachment: fixed;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    background-image:
      linear-gradient(rgba(11, 79, 72, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(11, 79, 72, 0.04) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
  }

  .hidden { display: none !important; }

  /* Boot */
  .boot {
    min-height: 100vh;
    display: grid;
    place-content: center;
    text-align: center;
    gap: 0.4rem;
    animation: fadeIn 0.5s ease;
  }
  .boot__mark {
    width: 56px;
    height: 56px;
    margin: 0 auto 0.6rem;
    border-radius: 16px;
    background:
      linear-gradient(145deg, var(--brand) 0%, var(--brand-deep) 100%);
    box-shadow: var(--shadow);
    position: relative;
  }
  .boot__mark::after {
    content: "";
    position: absolute;
    inset: 14px 12px 12px 18px;
    border: 2px solid rgba(247, 250, 248, 0.85);
    border-radius: 4px;
    border-top-width: 8px;
  }
  .boot__brand {
    font-family: var(--font-serif);
    font-size: 2.4rem;
    margin: 0;
    letter-spacing: 0.02em;
  }
  .boot__hint { color: var(--muted); margin: 0; }

  /* Setup */
  .setup {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
    animation: riseIn 0.55s ease;
  }
  .setup__panel {
    width: min(560px, 100%);
    padding: 2.5rem 2.2rem;
    background:
      linear-gradient(180deg, rgba(247, 250, 248, 0.96), rgba(238, 243, 241, 0.92));
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--shadow);
  }
  .setup__brand {
    font-family: var(--font-serif);
    font-size: 2.6rem;
    margin: 0 0 0.75rem;
    color: var(--brand);
  }
  .setup__title {
    font-size: 1.35rem;
    font-weight: 600;
    margin: 0 0 0.75rem;
    line-height: 1.4;
  }
  .setup__lead {
    color: var(--ink-soft);
    line-height: 1.7;
    margin: 0 0 1.5rem;
  }
  .setup__user { color: var(--muted); font-size: 0.9rem; margin: 1.25rem 0 0; }

  /* Shell */
  .shell {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    min-height: 100vh;
    animation: fadeIn 0.4s ease;
  }

  .sidebar {
    position: sticky;
    top: 0;
    height: 100vh;
    padding: 1.25rem 1rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    background: linear-gradient(180deg, rgba(7, 56, 51, 0.96), rgba(11, 79, 72, 0.94));
    color: #eef6f3;
    border-right: 1px solid rgba(255,255,255,0.06);
  }
  .sidebar__brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.35rem 0.5rem;
  }
  .sidebar__logo {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(145deg, #1a6b62, #0b3f3a);
    border: 1px solid rgba(255,255,255,0.18);
    position: relative;
    flex-shrink: 0;
  }
  .sidebar__logo::after {
    content: "";
    position: absolute;
    inset: 10px 8px 8px 12px;
    border: 1.5px solid rgba(247, 250, 248, 0.9);
    border-radius: 3px;
    border-top-width: 6px;
  }
  .sidebar__name {
    font-family: var(--font-serif);
    font-size: 1.55rem;
    line-height: 1;
  }
  .sidebar__tag {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.65;
    margin-top: 0.2rem;
  }

  .nav { display: flex; flex-direction: column; gap: 0.25rem; }
  .nav__item {
    appearance: none;
    border: 0;
    background: transparent;
    color: rgba(238, 246, 243, 0.78);
    text-align: left;
    padding: 0.7rem 0.85rem;
    border-radius: 10px;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
  }
  .nav__item:hover {
    background: rgba(255,255,255,0.08);
    color: #fff;
  }
  .nav__item.is-active {
    background: rgba(255,255,255,0.14);
    color: #fff;
  }

  .sidebar__foot { margin-top: auto; display: grid; gap: 0.75rem; }
  .sidebar__search input {
    width: 100%;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(0,0,0,0.18);
    color: #fff;
    border-radius: 10px;
    padding: 0.65rem 0.75rem;
    font: inherit;
  }
  .sidebar__search input::placeholder { color: rgba(255,255,255,0.45); }
  .sidebar__email {
    margin: 0;
    font-size: 0.78rem;
    opacity: 0.6;
    padding: 0 0.35rem;
    word-break: break-all;
  }

  .main {
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 1.5rem;
    backdrop-filter: blur(10px);
    background: rgba(238, 243, 241, 0.78);
    border-bottom: 1px solid var(--line);
  }
  .topbar__title {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 600;
    flex: 1;
  }
  .topbar__actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .sidebar-toggle { display: none; }

  .content {
    padding: 1.25rem 1.5rem 2.5rem;
    animation: riseIn 0.35s ease;
  }
  .content.is-switching { animation: none; opacity: 0.4; }

  /* Buttons */
  .btn {
    appearance: none;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    border-radius: 10px;
    padding: 0.6rem 1rem;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
  .btn--primary {
    background: var(--brand);
    border-color: var(--brand-deep);
    color: #f4faf8;
  }
  .btn--primary:hover { background: var(--brand-deep); }
  .btn--accent {
    background: var(--accent);
    border-color: #a34a1c;
    color: #fff;
  }
  .btn--ghost {
    background: transparent;
  }
  .btn--danger {
    background: #fff5f4;
    border-color: #f0b4ae;
    color: var(--danger);
  }
  .icon-btn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 10px;
    width: 38px;
    height: 38px;
    cursor: pointer;
  }

  /* Dashboard */
  .hero-strip {
    display: grid;
    gap: 0.35rem;
    margin-bottom: 1.25rem;
  }
  .hero-strip__brand {
    font-family: var(--font-serif);
    font-size: clamp(2.2rem, 4vw, 3rem);
    color: var(--brand);
    margin: 0;
    line-height: 1;
  }
  .hero-strip__lead {
    margin: 0;
    color: var(--ink-soft);
    max-width: 42rem;
    line-height: 1.6;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0.85rem;
    margin-bottom: 1.5rem;
  }
  .stat {
    padding: 1rem 1.1rem;
    border-radius: var(--radius);
    background: linear-gradient(180deg, rgba(247,250,248,0.95), rgba(232,239,233,0.85));
    border: 1px solid var(--line);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .stat:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(11, 79, 72, 0.08);
  }
  .stat__label {
    font-size: 0.82rem;
    color: var(--muted);
    margin: 0 0 0.35rem;
  }
  .stat__value {
    font-family: var(--font-serif);
    font-size: 2rem;
    margin: 0;
    line-height: 1;
  }
  .stat__hint { margin: 0.4rem 0 0; font-size: 0.78rem; color: var(--muted); }

  .panel {
    background: rgba(247, 250, 248, 0.88);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 1.1rem 1.2rem;
  }
  .panel__title {
    margin: 0 0 0.85rem;
    font-size: 1rem;
    font-weight: 600;
  }

  .activity { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.55rem; }
  .activity__item {
    display: grid;
    grid-template-columns: 18px 1fr auto;
    gap: 0.65rem;
    align-items: start;
    padding: 0.55rem 0;
    border-bottom: 1px solid var(--line);
  }
  .activity__item:last-child { border-bottom: 0; }
  .activity__check {
    color: var(--ok);
    font-weight: 700;
    line-height: 1.4;
  }
  .activity__name { font-weight: 600; margin: 0; }
  .activity__detail { margin: 0.15rem 0 0; color: var(--ink-soft); font-size: 0.9rem; }
  .activity__time { color: var(--muted); font-size: 0.82rem; }

  /* Customers explorer */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    align-items: center;
    margin-bottom: 1rem;
  }
  .seg {
    display: inline-flex;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
  }
  .seg button {
    appearance: none;
    border: 0;
    background: transparent;
    padding: 0.5rem 0.75rem;
    font: inherit;
    font-size: 0.88rem;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .seg button.is-active {
    background: var(--brand);
    color: #fff;
  }

  .explorer {
    background: rgba(247, 250, 248, 0.75);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .zhuyin-group + .zhuyin-group {
    border-top: 1px solid var(--line);
  }
  .zhuyin-group__head {
    display: flex;
    align-items: baseline;
    gap: 0.65rem;
    padding: 0.65rem 1rem;
    background: rgba(11, 79, 72, 0.06);
    font-family: var(--font-serif);
    font-size: 1.35rem;
    color: var(--brand);
  }
  .zhuyin-group__rule {
    flex: 1;
    height: 1px;
    background: var(--line-strong);
    opacity: 0.55;
  }
  .folder-row {
    display: grid;
    grid-template-columns: 36px 1fr auto;
    gap: 0.75rem;
    align-items: center;
    width: 100%;
    text-align: left;
    padding: 0.85rem 1rem;
    border: 0;
    border-top: 1px solid transparent;
    background: transparent;
    font: inherit;
    cursor: pointer;
    transition: background 0.18s ease;
  }
  .folder-row:hover { background: rgba(11, 79, 72, 0.05); }
  .folder-icon {
    width: 34px;
    height: 28px;
    border-radius: 4px 4px 3px 3px;
    background: linear-gradient(180deg, #d8a25a 0%, #c48a3c 100%);
    position: relative;
  }
  .folder-icon::before {
    content: "";
    position: absolute;
    left: 0;
    top: -6px;
    width: 14px;
    height: 8px;
    border-radius: 3px 6px 0 0;
    background: #d8a25a;
  }
  .folder-row__name { font-weight: 600; margin: 0; }
  .folder-row__meta { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.85rem; }
  .completion {
    min-width: 88px;
    text-align: right;
  }
  .completion__bar {
    height: 6px;
    border-radius: 99px;
    background: rgba(19, 32, 30, 0.1);
    overflow: hidden;
    margin-bottom: 0.25rem;
  }
  .completion__fill {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--brand), #1f8a7c);
    border-radius: inherit;
    transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .completion__pct { font-size: 0.8rem; color: var(--muted); }

  /* Customer detail */
  .detail {
    display: grid;
    grid-template-columns: minmax(240px, 300px) 1fr;
    gap: 1rem;
    align-items: start;
  }
  .detail__side {
    position: sticky;
    top: 76px;
  }
  .avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 700;
    font-size: 1.2rem;
    margin-bottom: 0.75rem;
  }
  .field { margin-bottom: 0.85rem; }
  .field label {
    display: block;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 0.25rem;
  }
  .field input, .field textarea, .field select {
    width: 100%;
    border: 1px solid var(--line-strong);
    background: #fff;
    border-radius: 10px;
    padding: 0.55rem 0.7rem;
    font: inherit;
  }
  .field textarea { min-height: 88px; resize: vertical; }
  .tags { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .tag {
    font-size: 0.78rem;
    padding: 0.2rem 0.5rem;
    border-radius: 6px;
    background: rgba(11, 79, 72, 0.08);
    color: var(--brand);
  }

  .checklist { display: grid; gap: 0.35rem; margin: 0.75rem 0 0; }
  .checklist__item {
    display: flex;
    gap: 0.45rem;
    align-items: center;
    font-size: 0.88rem;
  }
  .checklist__item .ok { color: var(--ok); font-weight: 700; }
  .checklist__item .no { color: var(--danger); font-weight: 700; }

  .cat-block {
    margin-bottom: 1rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    background: rgba(247,250,248,0.9);
  }
  .cat-block__head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.75rem 1rem;
    background: rgba(11, 79, 72, 0.05);
    border-bottom: 1px solid var(--line);
    font-weight: 600;
  }
  .file-list { list-style: none; margin: 0; padding: 0; }
  .file-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.75rem;
    align-items: center;
    padding: 0.7rem 1rem;
    border-top: 1px solid var(--line);
  }
  .file-row:first-child { border-top: 0; }
  .file-row__name { margin: 0; font-weight: 500; }
  .file-row__meta { margin: 0.15rem 0 0; font-size: 0.8rem; color: var(--muted); }
  .file-actions { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .empty {
    padding: 1.25rem 1rem;
    color: var(--muted);
    font-size: 0.92rem;
  }

  /* Upload */
  .dropzone {
    border: 2px dashed rgba(11, 79, 72, 0.35);
    border-radius: 18px;
    padding: 2.5rem 1.5rem;
    text-align: center;
    background:
      linear-gradient(180deg, rgba(247,250,248,0.7), rgba(226,235,231,0.55));
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }
  .dropzone.is-drag {
    border-color: var(--brand);
    background: rgba(11, 79, 72, 0.08);
    transform: scale(1.01);
  }
  .dropzone__title {
    font-family: var(--font-serif);
    font-size: 1.8rem;
    margin: 0 0 0.4rem;
    color: var(--brand);
  }
  .dropzone__hint { margin: 0; color: var(--ink-soft); }
  .upload-form {
    display: grid;
    gap: 0.85rem;
    margin-top: 1.25rem;
    max-width: 520px;
  }

  /* Reports / Settings */
  .split-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
  .missing-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }
  .missing-item {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .missing-item:hover .missing-item__name { color: var(--brand); }
  .missing-item__name { margin: 0; font-weight: 600; }
  .missing-item__cats { margin: 0.2rem 0 0; color: var(--muted); font-size: 0.85rem; }

  .cat-editor { display: grid; gap: 0.45rem; }
  .cat-editor__row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.45rem;
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(19, 32, 30, 0.45);
    display: grid;
    place-items: center;
    padding: 1rem;
    z-index: 40;
    animation: fadeIn 0.2s ease;
  }
  .modal {
    width: min(440px, 100%);
    background: var(--surface);
    border-radius: 16px;
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    padding: 1.25rem;
    animation: riseIn 0.25s ease;
  }
  .modal h2 { margin: 0 0 0.85rem; font-size: 1.15rem; }
  .modal__actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
    margin-top: 1rem;
  }

  /* Toasts */
  .toasts {
    position: fixed;
    right: 1rem;
    bottom: 1rem;
    z-index: 50;
    display: grid;
    gap: 0.5rem;
  }
  .toast {
    min-width: 220px;
    max-width: 340px;
    padding: 0.75rem 0.9rem;
    border-radius: 12px;
    background: var(--ink);
    color: #f4faf8;
    font-size: 0.9rem;
    box-shadow: var(--shadow);
    animation: riseIn 0.25s ease;
  }
  .toast--error { background: var(--danger); }

  .search-results {
    display: grid;
    gap: 1rem;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }

  @media (max-width: 960px) {
    .shell { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: min(280px, 86vw);
      z-index: 30;
      transform: translateX(-105%);
      transition: transform 0.25s ease;
    }
    .sidebar.is-open { transform: none; }
    .sidebar-toggle { display: inline-grid; place-items: center; }
    .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .detail { grid-template-columns: 1fr; }
    .detail__side { position: static; }
    .split-2 { grid-template-columns: 1fr; }
  }

  @media (max-width: 640px) {
    .stat-grid { grid-template-columns: 1fr; }
    .content { padding: 1rem; }
    .folder-row { grid-template-columns: 36px 1fr; }
    .completion { grid-column: 2; text-align: left; margin-top: 0.25rem; }
  }
</style>
